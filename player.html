<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Ryhze</title>
  <style>
    :root{--purple:#5500FF;--ink:#f9f8ff;--muted:#c6c0d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05030d;color:var(--ink);font:500 15px/1.5 system-ui,sans-serif;animation:playerEnter .65s ease both}@keyframes playerEnter{from{opacity:0}to{opacity:1}}body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 10%,#34108e,transparent 32%),radial-gradient(circle at 90% 50%,#1a075c,transparent 34%),#05030d}.top{position:fixed;inset:0 0 auto;z-index:4;height:75px;display:flex;align-items:center;padding:0 28px;background:linear-gradient(#080512dd,transparent);backdrop-filter:blur(16px)}.back{border:0;border-radius:999px;padding:10px 16px;background:#ffffff15;color:#fff;font:inherit;cursor:pointer;transition:.2s}.back:hover{transform:scale(1.04);background:#ffffff25}.brand{margin-left:18px;font-weight:850;letter-spacing:.08em;color:#fff}.page{padding:110px clamp(18px,5vw,72px) 65px}.stage{position:relative;min-height:min(68vh,720px);border:1px solid #c8b5ff62;border-radius:28px;overflow:hidden;display:grid;place-items:center;background:#0b0719 center/cover no-repeat;box-shadow:inset 0 1px #fff4,0 25px 55px #0008}.stage:fullscreen{border:0;border-radius:0;width:100%;height:100%;background:#000}.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06030ee8 0%,#06030e65 55%,#06030e2b),linear-gradient(0deg,#06030ee8,transparent 55%)}.stage-content{z-index:1;width:min(650px,88%);text-align:center}.eyebrow{color:#d7caff;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800}.title{font-size:clamp(42px,7vw,86px);line-height:.95;letter-spacing:-.07em;margin:14px 0}.synopsis{color:#e2dff0;font-size:16px}.watch{margin-top:22px;border:1px solid #fff;border-radius:999px;padding:12px 22px;background:#fff;color:var(--purple);font:800 15px system-ui;cursor:pointer;transition:.2s}.watch:hover{transform:scale(1.04);box-shadow:0 10px 26px #fff4}.status{margin:18px 0 0;color:#cfc8e3;font-size:13px}.playing .stage::after{background:#000e}.playing .stage-content{opacity:0;transition:opacity .35s}.playing .stage::before{content:"Now playing";position:absolute;z-index:2;color:#fff;font-size:18px;letter-spacing:.08em}.player-ui{position:absolute;inset:0;z-index:5;pointer-events:none}.player-ui[hidden]{display:none}.exit-player,.scrubber-island{pointer-events:auto;border:1px solid rgba(255,255,255,.22);background:rgba(24,23,35,.52);backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%);box-shadow:inset 0 1px rgba(255,255,255,.22),0 12px 32px rgba(0,0,0,.34)}.exit-player{position:absolute;top:18px;left:18px;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;color:#fff;font:400 28px/1 system-ui;cursor:pointer;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s}.exit-player span{display:block;line-height:1;transform:translateY(-2px)}.scrubber-island{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:min(740px,calc(100% - 36px));padding:11px 15px;border-radius:999px;transition:transform .48s cubic-bezier(.2,.8,.2,1),opacity .3s}.player-ui.idle .exit-player{transform:translateX(-72px);opacity:0}.player-ui.idle .scrubber-island{transform:translate(-50%,74px);opacity:0}.stage video{filter:none;transition:transform .78s cubic-bezier(.18,.8,.2,1),opacity .62s ease}.stage.cinema-switch video{transform:scale(.91);opacity:.25}.scrubber-island input{--progress:0%;appearance:none;width:100%;height:5px;border-radius:999px;outline:0;background:linear-gradient(90deg,#fff var(--progress),rgba(255,255,255,.28) var(--progress));cursor:pointer}.scrubber-island input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 7px #0008}.scrubber-time{min-width:88px;text-align:right;color:#fff;font-size:12px;font-variant-numeric:tabular-nums}@media(max-width:600px){.scrubber-island{bottom:16px}.scrubber-time{min-width:72px;font-size:11px}.exit-player{top:12px;left:12px}}
    body{background:#000;animation:none}body::before{opacity:0;animation:playerEnter .65s .2s ease forwards}.top,.page{opacity:0;animation:playerEnter .65s .2s ease forwards}.page{height:100svh;min-height:0;padding:78px clamp(18px,5vw,72px) 18px;overflow:hidden}.stage{border:0;width:100%;margin:0 auto}.playing .stage::after{background:transparent}.stage.cinematic{position:fixed;inset:0;z-index:100;width:100vw!important;height:100vh;min-height:100vh;border-color:transparent;border-radius:0;background:#000;box-shadow:none;transform-origin:top left}.stage.cinematic video{filter:none}.stage.cinematic .player-ui{z-index:5}
  </style>
  <style>.return-fade{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none;transition:opacity .55s ease}.return-fade.show{opacity:1}</style>
</head>
<body>
  <header class="top"><button class="back" id="backToRyhze">← Back to Ryhze</button><span class="brand">RYHZE</span></header>
  <main class="page"><section class="stage" id="stage"><video id="video" playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;z-index:3"></video><div class="player-ui" id="playerUi" hidden><button class="exit-player" id="exitPlayer" aria-label="Exit full screen"><span id="exitSymbol">×</span></button><div class="scrubber-island"><input id="scrubber" type="range" min="0" max="100" value="0" aria-label="Video progress"><span class="scrubber-time" id="scrubberTime">0:00 / 0:00</span></div></div><div class="stage-content"><div class="eyebrow">Ryhze · ready to play</div><h1 class="title" id="title"></h1><p class="synopsis" id="synopsis"></p><button class="watch" id="watch">Watch now</button><p class="status" id="status">Your title is ready when you are.</p></div></section></main>
  <div class="return-fade" id="returnFade"></div><script>
    const params=new URLSearchParams(location.search),title=params.get('title')||'Ryhze Title',synopsis=params.get('synopsis')||'Details coming soon.',image=params.get('image')||'';let streams=[],rawStreams=params.get('streams')||'[]';try{streams=JSON.parse(rawStreams)}catch{try{streams=JSON.parse(decodeURIComponent(rawStreams))}catch{}}
    document.title=`${title} — Ryhze`;document.querySelector('#title').textContent=title;document.querySelector('#synopsis').textContent=synopsis;if(image)document.querySelector('#stage').style.backgroundImage=`url("${image}")`;const returnToMenu=()=>{document.querySelector('#returnFade').classList.add('show');setTimeout(()=>history.back(),560)};document.querySelector('#backToRyhze').addEventListener('click',returnToMenu);
    const video=document.querySelector('#video'),stage=document.querySelector('#stage'),playerUi=document.querySelector('#playerUi'),scrubber=document.querySelector('#scrubber'),scrubberTime=document.querySelector('#scrubberTime'),exitPlayer=document.querySelector('#exitPlayer');let uiTimer,cinematicTransition=false,stageRect,stageStyle;const matchPlayerRatio=()=>{if(stage.classList.contains('cinematic'))return;const maxHeight=Math.max(250,window.innerHeight-96),maxWidth=stage.parentElement.clientWidth,width=Math.min(maxWidth,maxHeight*window.innerWidth/window.innerHeight);stage.style.aspectRatio=`${window.innerWidth} / ${window.innerHeight}`;stage.style.minHeight='0';stage.style.width=`${width}px`};matchPlayerRatio();window.addEventListener('resize',matchPlayerRatio);const formatTime=value=>{if(!Number.isFinite(value))return'0:00';return`${Math.floor(value/60)}:${String(Math.floor(value%60)).padStart(2,'0')}`};const updateScrubber=()=>{const percent=video.duration?video.currentTime/video.duration*100:0;scrubber.value=percent;scrubber.style.setProperty('--progress',`${percent}%`);scrubberTime.textContent=`${formatTime(video.currentTime)} / ${formatTime(video.duration)}`};const revealUi=()=>{if(playerUi.hidden)return;playerUi.classList.remove('idle');clearTimeout(uiTimer);if(!video.paused)uiTimer=setTimeout(()=>playerUi.classList.add('idle'),3000)};const syncCinematicButton=()=>{const cinematic=stage.classList.contains('cinematic');exitPlayer.textContent=cinematic?'×':'⛶';exitPlayer.setAttribute('aria-label',cinematic?'Exit cinematic mode':'Enter cinematic mode')};const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));const cardTransform=()=>{const scale=stageRect.width/window.innerWidth,left=stageRect.left,top=stageRect.top;return`translate(${left}px,${top}px) scale(${scale})`};const transitionStyle='transform .9s cubic-bezier(.2,.82,.2,1),border-radius .9s cubic-bezier(.2,.82,.2,1),border-color .65s ease';const toggleCinematic=async()=>{if(cinematicTransition)return;cinematicTransition=true;playerUi.classList.remove('idle');if(!stage.classList.contains('cinematic')){stageRect=stage.getBoundingClientRect();const styles=getComputedStyle(stage);stageStyle={radius:styles.borderRadius,color:styles.borderColor};stage.style.borderRadius=stageStyle.radius;stage.style.borderColor=stageStyle.color;stage.style.transition='none';stage.style.transform=cardTransform();stage.classList.add('cinematic');void stage.offsetWidth;stage.style.transition=transitionStyle;stage.style.transform='translate(0,0) scale(1)';stage.style.borderRadius='0';stage.style.borderColor='transparent';await wait(920);stage.style.borderRadius='';stage.style.borderColor=''}else{stage.style.borderRadius='0';stage.style.borderColor='transparent';stage.style.transition=transitionStyle;stage.style.transform=cardTransform();stage.style.borderRadius=stageStyle.radius;stage.style.borderColor=stageStyle.color;await wait(920);stage.classList.remove('cinematic');stage.style.transition='';stage.style.transform='';stage.style.borderRadius='';stage.style.borderColor='';matchPlayerRatio()}syncCinematicButton();cinematicTransition=false;revealUi()};video.addEventListener('timeupdate',updateScrubber);video.addEventListener('loadedmetadata',updateScrubber);scrubber.addEventListener('input',()=>{if(video.duration)video.currentTime=video.duration*scrubber.value/100});stage.addEventListener('pointermove',revealUi);exitPlayer.addEventListener('click',toggleCinematic);
    document.querySelector('#watch').addEventListener('click',async()=>{if(!streams.length){document.querySelector('#status').textContent='No media was found in this title’s Stream or Streams folder.';return}const status=document.querySelector('#status');video.muted=false;video.volume=1;let index=0,advancing=false;const playNext=async()=>{if(advancing)return;advancing=true;if(index>=streams.length){video.style.display='none';document.body.classList.remove('playing');status.textContent='This title has no browser-compatible stream. Use MP4 or WebM for video; MP3 is audio-only.';return}const stream=streams[index++];status.textContent=`Loading ${stream.type.toUpperCase()}…`;video.onerror=()=>{advancing=false;playNext()};video.src=stream.url;video.style.display='block';document.body.classList.add('playing');try{await video.play();video.onerror=null;playerUi.hidden=false;syncCinematicButton();status.textContent='Playing';advancing=false;updateScrubber();revealUi()}catch(error){video.onerror=null;advancing=false;playNext()}};await playNext();});
  </script>
  <script>document.querySelector('#backToRyhze').addEventListener('click',event=>{event.stopImmediatePropagation();sessionStorage.setItem('ryhzeReturnFade','1');document.querySelector('#returnFade').classList.add('show');setTimeout(()=>history.back(),560)},{capture:true});document.querySelector('#exitPlayer').style.paddingBottom='4px';</script>
</body>
</html>
