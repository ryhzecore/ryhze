  <style>
    :root{--purple:#5500FF;--ink:#f9f8ff;--muted:#c6c0d8;--line:rgba(170,136,255,.34)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05030d;color:var(--ink);font:500 15px/1.5 system-ui,sans-serif;animation:playerEnter .65s ease both}@keyframes playerEnter{from{opacity:0}to{opacity:1}}body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 10%,#34108e,transparent 32%),radial-gradient(circle at 90% 50%,#1a075c,transparent 34%),#05030d}.top{position:fixed;inset:0 0 auto;z-index:4;height:75px;display:flex;align-items:center;padding:0 28px;background:linear-gradient(#080512dd,transparent);backdrop-filter:blur(16px)}.back{border:0;border-radius:999px;padding:10px 16px;background:#ffffff15;color:#fff;font:inherit;cursor:pointer;transition:.2s}.back:hover{transform:scale(1.04);background:#ffffff25}.brand{margin-left:18px;font-weight:850;letter-spacing:.08em;color:#fff}.page{padding:110px clamp(18px,5vw,72px) 65px}.stage{position:relative;min-height:min(68vh,720px);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:grid;place-items:center;background:#0b0719 center/cover no-repeat;box-shadow:inset 0 1px rgba(239,235,255,.34),0 12px 30px rgba(0,0,0,.24)}.stage:fullscreen{border:0;border-radius:0;width:100%;height:100%;background:#000}.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06030ee8 0%,#06030e65 55%,#06030e2b),linear-gradient(0deg,#06030ee8,transparent 55%)}.stage-content{z-index:1;width:min(650px,88%);text-align:center}.eyebrow{color:#d7caff;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800}.title{font-size:clamp(42px,7vw,86px);line-height:.95;letter-spacing:-.07em;margin:14px 0}.synopsis{color:#e2dff0;font-size:16px}.watch{margin-top:22px;border:1px solid #fff;border-radius:999px;padding:12px 22px;background:#fff;color:var(--purple);font:800 15px system-ui;cursor:pointer;transition:.2s}.watch:hover{transform:scale(1.04);bo   <style>.return-fade{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none;transition:opacity .55s ease}.return-fade.show{opacity:1}.top{transition:opacity .32s ease,transform .32s ease;position:absolute}.player-cinematic .top{opacity:0;transform:translateY(-14px);pointer-events:none}.back,.series-select>button{border:1px solid var(--line);background:linear-gradient(135deg,rgba(85,0,255,.29),rgba(42,17,118,.16));box-shadow:inset 0 1px rgba(239,235,255,.34),0 12px 30px rgba(0,0,0,.24);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .22s ease,background .22s ease,box-shadow .22s ease}.back:hover,.series-select>button:hover{transform:scale(1.035);background:linear-gradient(135deg,rgba(105,38,255,.38),rgba(56,18,150,.22));box-shadow:inset 0 1px rgba(248,245,255,.48),0 16px 35px rgba(0,0,0,.34),0 0 28px rgba(85,0,255,.24)}.back{border-radius:22px;padding:10px 16px;color:#fff;font:inherit;cursor:pointer}.brand{margin-left:18px;font-weight:700;letter-spacing:0;color:#fff;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.series-controls{display:none;margin-left:auto;gap:8px}.series-controls.show{display:flex}.series-select{position:relative;flex:0 0 auto;width:max-content}.series-select>button{display:block;width:100%;min-width:108px;border-radius:22px;padding:10px 14px;color:#fff;font:inherit;cursor:pointer;white-space:nowrap}.series-options{position:absolute;top:calc(100% + 8px);left:0;right:auto;display:none;width:100%;max-width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(67,20,174,.86),rgba(15,10,46,.90));box-shadow:inset 0 1px rgba(239,235,255,.34),0 12px 30px rgba(0,0,0,.24);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden}.series-options.open{display:grid;gap:4px}.series-options button{display:block;width:100%;min-width:0;border:0;border-radius:14px;padding:9px 10px;background:transp <style>.stage video{object-fit:cover!important}.embedded-player .stage{height:90%!important;transform:translateY(0);transition:transform .3s ease,box-shadow .3s ease}.embedded-player .page{align-items:flex-end;padding-bottom:12px!important}.embedded-player .top{padding-right:0}.embedded-player body:not(.embed-fullscreen) .stage:hover{transform:translateY(0) scale(1.012);box-shadow:inset 0 1px rgba(255,255,255,.34),0 18px 42px rgba(0,0,0,.42),0 0 24px rgba(85,0,255,.16);z-index:2}.embedded-player body.embed-fullscreen .page{align-items:stretch;padding-bottom:0!important}.embedded-player body.embed-fullscreen .stage{height:100%!important;transform:none!important}.embedded-player body.embed-fullscreen .stage video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;transform:none!important;object-fit:cover!important}.change-series{display:block;max-width:0;overflow:hidden;white-space:nowrap;border:1px solid #fff;border-radius:999px;padding:10px 0;background:#fff;color:var(--purple);font:700 15px system-ui,sans-serif;cursor:pointer;opacity:0;transform:scale(.94);pointer-events:none;transition:max-width .35s ease,padding .35s ease,opacity .35s ease,transform .35s ease}.series-controls.series-playing .series-select{opacity:0;transform:scale(.9);pointer-events:none;width:0;overflow:hidden;transition:opacity .25s ease,transform .35s ease,width .35s ease}.series-controls.series-playing .change-series{max-width:160px;padding:10px 16px;opacity:1;transform:scale(1);pointer-events:auto}

<body>
  <header class="top"><button class="back" id="backToRyhze">← Back</button><span class="brand" id="brand"></span><div class="series-controls" id="seriesControls"><div class="series-select"><button type="button" id="seasonButton">Season 1⌄</button><div class="series-options" id="seasonOptions"></div></div><div class="series-select"><button type="button" id="episodeButton">Episode 1⌄</button><div class="series-options" id="episodeOptions"></div></div><button type="button" class="change-series" id="changeSeries">Change Series</button></div></header>
  <main class="page"><section class="stage" id="stage"><video id="video" playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;z-index:3"></video><div class="player-ui" id="playerUi" hidden><button class="exit-player" id="exitPlayer" aria-label="Exit full screen"><span id="exitSymbol">×</span></button><div class="scrubber-island"><input id="scrubber" type="range" min="0" max="100" value="0" aria-label="Video progress"><span class="scrubber-time" id="scrubberTime">0:00 / 0:00</span></div></div><div class="stage-content"><button class="watch" id="watch">Watch now</button></div></section></main>
  <div class="return-fade" id="returnFade"></div><script>
    const params=new URLSearchParams(location.search),title=params.get('title')||'Ryhze Title',synopsis=params.get('synopsis')||'Details coming soon.',image=params.get('image')||'',mediaType=params.get('type')||'Movie',licensor=params.get('licensor')||'Not specified';let streams=[],rawStreams=params.get('streams')||'[]',seasons=[];try{streams=JSON.parse(rawStreams)}catch{try{streams=JSON.parse(decodeURIComponent(rawStreams))}catch{}}try{seasons=JSON.parse(params.get('seasons')||'[]')}catch{try{seasons=JSON.parse(decodeURIComponent(params.get('seasons')||'[]'))}catch{}}if(mediaType==='Series'&&!streams.length&&seasons[0]?.episodes?.[0]?.streams)streams=[...seasons[0].episodes[0].streams];for(let index=streams.length-1;index>0;index--){const randomIndex=Math.floor(Math.random()*(index+1));[streams[index],streams[randomIndex]]=[streams[randomIndex],streams[index]]}
    document.title=`${title} — Ryhze`;document.querySelector('#brand').textContent=title;if(image)document.querySelector('#stage').style.backgroundImage=`url("${image}")`;if(mediaType==='Series'&&seasons.length){const controls=document.querySelector('#seriesControls'),seasonOptions=document.querySelector('#seasonOptions'),episodeOptions=document.querySelector('#episodeOptions'),seasonButton=document.querySelector('#seasonButton'),episodeButton=document.querySelector('#episodeButton'),uniqueSeasons=Array.from(new Map(seasons.map(season=>[season.title,season])).values());controls.classList.add('show');const syncMenuWidths=()=>document.querySelectorAll('.series-select').forEach(select=>{const button=select.querySelector(':scope>button'),options=select.querySelector(':scope>.series-options');if(button&&options)options.style.width=`${button.getBoundingClientRect().width}px`});const renderEpisodes=seasonIndex=>{seasonButton.dataset.season=seasonIndex;episodeOptions.innerHTML='';(uniqueSeasons[seasonIndex]?.episodes||[]).forEach((episode,index)=>episodeOptions.insertAdjacentHTML('beforeend',`<button type="button" data-episode="${index}">${episode.title||`Episode ${index+1}`}</button>`));episodeButton.textContent='Episode 1⌄';syncMenuWidths()};seasonOptions.innerHTML='';uniqueSeasons.forEach((season,index)=>seasonOptions.insertAdjacentHTML('beforeend',`<button type="button" data-season="${index}">${season.title||`Season ${index+1}`}</button>`));renderEpisodes(0);syncMenuWidths();window.addEventListener('resize',syncMenuWidths);document.querySelectorAll('.series-select>button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.series-options').forEach(options=>{if(options!==button.nextElementSibling)options.classList.remove('open')});button.nextElementSibling.classList.toggle('open');syncMenuWidths()}));seasonOptions.addEventListener('click',event=>{const button=event.target.closest('[data-season]');if(!button)return;seasonButton.textContent=`${button.textContent}⌄`;seasonOptions.classList.remove('open');renderEpisodes(Number(button.dataset.season));streams=[...(uniqueSeasons[Number(button.dataset.season)]?.episodes?.[0]?.streams||[])]});episodeOptions.addEventListener('click',event=>{const button=event.target.closest('[data-episode]');if(!button)return;episodeButton.textContent=`${button.textContent}⌄`;episodeOptions.classList.remove('open');const seasonIndex=Number(seasonButton.dataset.season||0);streams=[...(uniqueSeasons[seasonIndex]?.episodes?.[Number(button.dataset.episode)]?.streams||[])]})}if(params.get('embedded')==='1')requestAnimationFrame(()=>requestAnimationFrame(()=>parent.postMessage({type:'ryhze-player-ready'},'*')));const returnToMenu=()=>{document.querySelector('#returnFade').classList.add('show');setTimeout(()=>history.back(),560)};document.querySelector('#backToRyhze').addEventListener('click',returnToMenu);
    const video=document.querySelector('#video'),stage=document.querySelector('#stage'),playerUi=document.querySelector('#playerUi'),scrubber=document.querySelector('#scrubber'),scrubberTime=document.querySelector('#scrubberTime'),exitPlayer=document.querySelector('#exitPlayer');let uiTimer,cinematicTransition=false,stageRect,stageStyle;const matchPlayerRatio=()=>{if(stage.classList.contains('cinematic'))return;if(document.documentElement.classList.contains('embedded-player')){stage.style.aspectRatio='auto';stage.style.minHeight='0';stage.style.width='100%';stage.style.height='100%';return}const maxHeight=Math.max(250,window.innerHeight-96),maxWidth=stage.parentElement.clientWidth,width=Math.min(maxWidth,maxHeight*window.innerWidth/window.innerHeight);stage.style.aspectRatio=`${window.innerWidth} / ${window.innerHeight}`;stage.style.minHeight='0';stage.style.width=`${width}px`};matchPlayerRatio();window.addEventListener('resize',matchPlayerRatio);const formatTime=value=>{if(!Number.isFinite(value))return'0:00';return`${Math.floor(value/60)}:${String(Math.floor(value%60)).padStart(2,'0')}`};const updateScrubber=()=>{const percent=video.duration?video.currentTime/video.duration*100:0;scrubber.value=percent;scrubber.style.setProperty('--progress',`${percent}%`);scrubberTime.textContent=`${formatTime(video.currentTime)} / ${formatTime(video.duration)}`};const revealUi=()=>{if(playerUi.hidden)return;playerUi.classList.remove('idle');clearTimeout(uiTimer);if(!video.paused)uiTimer=setTimeout(()=>playerUi.classList.add('idle'),3000)};const syncCinematicButton=()=>{const cinematic=stage.classList.contains('cinematic');exitPlayer.textContent=cinematic?'×':'⛶';exitPlayer.setAttribute('aria-label',cinematic?'Exit cinematic mode':'Enter cinematic mode')};const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));const cardTransform=()=>{const scale=stageRect.width/window.innerWidth,left=stageRect.left,top=stageRect.top;return`translate(${left}px,${top}px) scale(${scale})`};const transitionStyle='transform .9s cubic-bezier(.2,.82,.2,1),border-radius .9s cubic-bezier(.2,.82,.2,1),border-color .65s ease';const toggleCinematic=async()=>{if(cinematicTransition)return;cinematicTransition=true;playerUi.classList.remove('idle');if(!stage.classList.contains('cinematic')){stageRect=stage.getBoundingClientRect();const styles=getComputedStyle(stage);stageStyle={radius:styles.borderRadius,color:styles.borderColor};stage.style.borderRadius=stageStyle.radius;stage.style.borderColor=stageStyle.color;stage.style.transition='none';stage.style.transform=cardTransform();stage.classList.add('cinematic');void stage.offsetWidth;stage.style.transition=transitionStyle;stage.style.transform='translate(0,0) scale(1)';stage.style.borderRadius='0';stage.style.borderColor='transparent';await wait(920);stage.style.borderRadius='';stage.style.borderColor=''}else{stage.style.borderRadius='0';stage.style.borderColor='transparent';stage.style.transition=transitionStyle;stage.style.transform=cardTransform();stage.style.borderRadius=stageStyle.radius;stage.style.borderColor=stageStyle.color;await wait(920);stage.classList.remove('cinematic');stage.style.transition='';stage.style.transform='';stage.style.borderRadius='';stage.style.borderColor='';matchPlayerRatio()}syncCinematicButton();cinematicTransition=false;revealUi()};video.addEventListener('timeupdate',updateScrubber);video.addEventListener('loadedmetadata',updateScrubber);scrubber.addEventListener('input',()=>{if(video.duration)video.currentTime=video.duration*scrubber.value/100});stage.addEventListener('pointermove',revealUi);exitPlayer.addEventListener('click',toggleCinematic);
    document.querySelector('#watch').addEventListener('click',async()=>{if(!streams.length)return;const status=document.createElement('span');video.muted=false;video.volume=1;let index=0,advancing=false;const localMode=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';const playNext=async()=>{if(advancing)return;advancing=true;if(index>=streams.length){video.style.display='none';document.body.classList.remove('playing');return}const stream=streams[index++];const source=localMode?(stream.url||stream.publicUrl):(stream.publicUrl||stream.url);const playbackUrl=localMode?source:`${source}${source.includes('?')?'&':'?'}playback=${Date.now()}`;status.textContent=`Loading ${stream.type.toUpperCase()}…`;video.onerror=()=>{advancing=false;playNext()};video.src=playbackUrl;video.style.display='block';document.body.classList.add('playing');try{await video.play();video.onerror=null;playerUi.hidden=false;syncCinematicButton();status.textContent='Playing';advancing=false;updateScrubber();revealUi()}catch(error){video.onerror=null;advancing=false;playNext()}};await playNext();});
  </script>
  <script>const embeddedPlayer=new URLSearchParams(location.search).get('embedded')==='1';document.querySelector('#backToRyhze').addEventListener('click',event=>{event.stopImmediatePropagation();if(embeddedPlayer){window.parent.postMessage({type:'ryhze-close-player'},'*');return}sessionStorage.setItem('ryhzeReturnFade','1');document.querySelector('#returnFade').classList.add('show');setTimeout(()=>location.replace('menu/index.html?returning=1'),560)},{capture:true});if(embeddedPlayer)exitPlayer.addEventListener('click',event=>{event.stopImmediatePropagation();window.parent.postMessage({type:'ryhze-toggle-player-fullscreen'},'*')},{capture:true});addEventListener('message',event=>{if(event.data?.type!=='ryhze-embed-fullscreen')return;const fullscreen=!!event.data.fullscreen;document.body.classList.toggle('embed-fullscreen',fullscreen);exitPlayer.textContent=fullscreen?'×':'⛶';exitPlayer.setAttribute('aria-label',fullscreen?'Exit full screen':'Enter full screen')});document.querySelector('#exitPlayer').style.paddingBottom='4px';new MutationObserver(()=>document.body.classList.toggle('player-cinematic',document.querySelector('#stage').classList.contains('cinematic'))).observe(document.querySelector('#stage'),{attributes:true,attributeFilter:['class']});</script>

<script>document.querySelectorAll('#seasonButton,#episodeButton').forEach(button=>{const clean=()=>{if(button.textContent.includes('⌄'))button.textContent=button.textContent.replaceAll('⌄','▾')};clean();new MutationObserver(clean).observe(button,{childList:true,characterData:true,subtree:true})});(()=>{const controls=document.querySelector('#seriesControls'),change=document.querySelector('#changeSeries'),video=document.querySelector('#video'),ui=document.querySelector('#playerUi'),stage=document.querySelector('#stage');if(!controls||!change)return;const sync=()=>controls.classList.toggle('series-playing',document.body.classList.contains('playing'));new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['class']});change.addEventListener('click',()=>{video.pause();video.removeAttribute('src');video.load();video.style.display='none';video.currentTime=0;ui.hidden=true;ui.classList.remove('idle');stage.classList.remove('cinema-switch');document.body.classList.remove('playing');sync()});sync()})();</script>
