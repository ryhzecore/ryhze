<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Ryhze — Menu</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#080a12}iframe{display:block}</style>
</head>
<body>
  <iframe id="menu" title="Ryhze Menu" allow="fullscreen"></iframe>
  <script>
    if (sessionStorage.getItem('ryhze-access') !== 'granted') location.replace('../index.html');
    const mode = new URLSearchParams(location.search).get('mode') === 'games' ? 'games' : 'films';
    document.querySelector('#menu').src = `../lobby.html?mode=${mode}`;
    if (location.protocol !== 'file:') history.replaceState(null, '', './');
  </script>
</body>
</html>
