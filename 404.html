<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryhze</title>
<script>
  const path = location.pathname.replace(/\/+$/, '');
  const filmRoute = path.match(/^(.*\/)menu\/films\/([^/]+)$/);
  if (filmRoute) {
    location.replace(`${filmRoute[1]}menu/films/player.html?title=${encodeURIComponent(filmRoute[2])}`);
  } else {
    location.replace('./');
  }
</script>
