<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Ryhze Game</title>
  <style>
    :root{--violet:#5500ff;--line:rgba(170,136,255,.34);--text:#f9f8ff;--muted:#c8c0dd}*{box-sizing:border-box}html{background:#07040f}body{margin:0;min-height:100vh;color:var(--text);font:500 15px/1.55 'Space Grotesk',system-ui,sans-serif;background:radial-gradient(circle at 8% 0,#311184 0,transparent 34%),radial-gradient(circle at 90% 14%,#18094c 0,transparent 32%),#07040f}.shell{width:min(1400px,94vw);margin:0 auto;padding:20px 0 52px}.top{display:flex;align-items:center;gap:18px;min-height:64px;margin-bottom:16px}.back,.action{border:1px solid var(--line);border-radius:22px;padding:10px 16px;background:linear-gradient(135deg,rgba(85,0,255,.29),rgba(42,17,118,.16));box-shadow:inset 0 1px rgba(239,235,255,.34),0 12px 30px rgba(0,0,0,.24);color:#fff;font:inherit;cursor:pointer;transition:transform .22s ease,background .22s ease,box-shadow .22s ease}.back:hover,.action:hover{transform:scale(1.035);background:linear-gradient(135deg,rgba(105,38,255,.38),rgba(56,18,150,.22));box-shadow:inset 0 1px rgba(248,245,255,.48),0 16px 35px rgba(0,0,0,.34),0 0 28px rgba(85,0,255,.24)}.brand{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{position:relative;min-height:min(62vh,720px);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;align-items:flex-end;padding:clamp(24px,5vw,64px);background:#0b0719 center/cover no-repeat;box-shadow:inset 0 1px rgba(239,235,255,.34),0 20px 52px rgba(0,0,0,.35)}.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,3,14,.9) 0%,rgba(6,3,14,.5) 54%,rgba(6,3,14,.15)),linear-gradient(0deg,rgba(6,3,14,.93),transparent 60%)}.stage-copy{position:relative;z-index:1;max-width:700px}.eyebrow{color:#ded4ff;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font-size:clamp(42px,7vw,86px);line-height:.94;letter-spacing:-.07em;margin:14px 0}.release{margin:0;color:#ded6ee;font-size:14px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.primary{border-color:#fff;background:#fff;color:var(--violet);font-weight:800}.details{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);gap:18px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:26px;padding:26px;background:rgba(19,12,45,.66);box-shadow:inset 0 1px rgba(239,235,255,.18),0 18px 48px rgba(0,0,0,.2);backdrop-filter:blur(18px)}h2{margin:0 0 12px;font-size:22px;letter-spacing:-.04em}.panel p{margin:0;color:#e3deed;font-size:16px}.label{display:block;color:#a99ecb;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:18px}.value{display:block;margin-top:4px;color:#fff}.toast{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,120px);padding:11px 16px;border-radius:16px;background:#fff;color:var(--violet);font-weight:800;box-shadow:0 16px 36px #0008;transition:transform .25s ease}.toast.show{transform:translate(-50%,0)}@media(max-width:720px){.shell{width:calc(100% - 24px);padding-top:8px}.top{margin-bottom:8px}.stage{min-height:560px;padding:28px;border-radius:24px}.details{grid-template-columns:1fr}.panel{border-radius:22px;padding:21px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><button class="back" id="back">← Back</button><span class="brand" id="brand">Ryhze Game</span></header>
    <section class="stage" id="stage"><div class="stage-copy"><div class="eyebrow">Ryhze Games</div><h1 class="title" id="title">Game</h1><p class="release" id="release">Coming soon</p><div class="buttons"><button class="action primary" id="preorder">Get Now</button><button class="action" id="list">Add to list</button></div></div></section>
    <section class="details"><article class="panel"><h2>About this game</h2><p id="synopsis">Details coming soon.</p></article><aside class="panel"><h2>Game info</h2><span class="label">Categories</span><span class="value" id="categories">Uncategorized</span><span class="label">Licensor</span><span class="value" id="licensor">Not specified</span><span class="label">Availability</span><span class="value">Pre-order</span></aside></section>
  </main><div class="toast" id="toast"></div>
  <script>
    const params=new URLSearchParams(location.search),title=params.get('title')||'Ryhze Game',synopsis=params.get('synopsis')||'Details coming soon.',image=params.get('image')||'',categories=params.get('categories')||'Uncategorized',release=params.get('release')||'Coming soon',licensor=params.get('licensor')||'Not specified',embedded=params.get('embedded')==='1';let installer=null;try{installer=JSON.parse(params.get('installer')||'null')}catch{}
    document.title=`${title} — Ryhze`;document.querySelector('#brand').textContent=title;document.querySelector('#title').textContent=title;document.querySelector('#synopsis').textContent=synopsis;document.querySelector('#categories').textContent=categories;document.querySelector('#release').textContent=`Release: ${release}`;document.querySelector('#licensor').textContent=licensor;if(image)document.querySelector('#stage').style.backgroundImage=`url("${image}")`;
    const toast=message=>{const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)},key='ryhze-my-list',read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}},list=document.querySelector('#list'),sync=()=>list.textContent=read().some(item=>item.title===title)?'Remove from list':'Add to list';
    list.addEventListener('click',()=>{const items=read(),index=items.findIndex(item=>item.title===title);if(index>=0){items.splice(index,1);toast('Removed from My List')}else{items.unshift({title,synopsis,image,mediaType:'Game',categories:categories.split(',').map(item=>item.trim())});toast('Added to My List')}localStorage.setItem(key,JSON.stringify(items));sync();});sync();
    const action=document.querySelector('#preorder'),native=window.chrome?.webview?.hostObjects?.ryhzeNative;let installed=false;
    const refreshGameState=async()=>{if(!native)return;try{installed=(await native.GetGameState(title))==='installed';action.textContent=installed?'Play Now':'Get Now'}catch{}};
    action.addEventListener('click',async()=>{if(installed&&native){try{if(await native.LaunchGame(title))toast(`Launching ${title}…`);else toast(`${title} could not be launched.`)}catch{toast(`${title} could not be launched.`)}return}if(native&&installer){try{if(await native.InstallGame(title))toast(`Opening ${installer.name}…`);else toast('Installer package was not found.')}catch{toast('Installer package was not found.')}return}if(installer?.url){const link=document.createElement('a');link.href=installer.url;link.download=installer.name||'';link.click();toast('Your game download is starting.')}else toast('No installer package is available yet.');});refreshGameState();if(native)setInterval(refreshGameState,5000);document.querySelector('#back').addEventListener('click',()=>embedded?parent.postMessage({type:'ryhze-close-player'},'*'):history.back());if(embedded)requestAnimationFrame(()=>requestAnimationFrame(()=>parent.postMessage({type:'ryhze-game-ready'},'*')));
  </script>
</body>
</html>
