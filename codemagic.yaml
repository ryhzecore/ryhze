workflows:
  apple-verification:
    name: Ryhze Apple build verification
    working_directory: RyhzeApp/Launcher
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve packages
        script: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Validate shared application
        script: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Build iPhone and iPad simulator application
        script: flutter build ios --simulator --debug
      - name: Exercise iOS screens and remembered sign-in
        script: bash ../Build/verify-ios.sh
      - name: Verify device release compilation
        script: flutter build ios --release --no-codesign
      - name: Build macOS application
        script: flutter build macos --release
    artifacts:
      - RyhzeApp/Launcher/build/ios/iphonesimulator/*.app
      - RyhzeApp/Launcher/build/macos/Build/Products/Release/*.app
      - RyhzeApp/Launcher/.private/qa/*.png
      - $CM_BUILD_DIR/RyhzeApp/Launcher/build/ios-test-results/*.xcresult
      - $CM_BUILD_DIR/RyhzeApp/Launcher/build/ios-test-results/*.log

  ios-glass-capture:
    name: Ryhze iOS native glass capture
    working_directory: RyhzeApp/Launcher
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Capture actual iPhone simulator display
        script: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter build ios --simulator --debug
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r,group in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in group if d.get("isAvailable") and "iPhone" in d["name"]))')"
          if ! xcrun simctl list devices booted | grep -Fq "$SIM_ID"; then
            xcrun simctl boot "$SIM_ID"
          fi
          python3 ../Build/run-bounded.py 300 xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIM_ID" com.ryhze.ryhze
          sleep 8
          mkdir -p "$CM_EXPORT_DIR"
          xcrun simctl io "$SIM_ID" screenshot "$CM_EXPORT_DIR/ios-glass-home.png"
          sips -s format jpeg -s formatOptions 72 -Z 1400 "$CM_EXPORT_DIR/ios-glass-home.png" --out /tmp/ios-glass-preview.jpg >/dev/null
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = base64.b64encode(Path('/tmp/ios-glass-preview.jpg').read_bytes()).decode('ascii')
          print('RZIMG_BEGIN')
          for offset in range(0, len(encoded), 900):
              print('RZIMG:' + encoded[offset:offset + 900])
          print('RZIMG_END')
          PY
    artifacts:
      - $CM_EXPORT_DIR/ios-glass-home.png

  ios-testflight:
    name: Ryhze TestFlight release
    working_directory: RyhzeApp/Launcher
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ryhze TestFlight
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ryhze.ryhze
    scripts:
      - name: Resolve and validate
        script: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter analyze
          flutter test
      - name: Use configured signing profiles
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Verify iOS behavior before publishing
        script: bash ../Build/verify-ios.sh
      - name: Build signed release
        script: |
          set -euo pipefail
          : "${BUILD_NUMBER:?Codemagic workflow build number is required}"
          flutter build ipa --release --build-number="$((BUILD_NUMBER + 33))" --export-options-plist="$HOME/export_options.plist"
          shopt -s nullglob
          packages=(build/ios/ipa/*.ipa)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one signed iPhone package; found ${#packages[@]}." >&2
            exit 1
          fi
          mkdir -p "$CM_EXPORT_DIR"
          cp "${packages[0]}" "$CM_EXPORT_DIR/"
          test -s "$CM_EXPORT_DIR/$(basename "${packages[0]}")"
    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_BUILD_DIR/RyhzeApp/Launcher/build/ios/archive/*.xcarchive
      - $CM_BUILD_DIR/RyhzeApp/Launcher/build/ios-test-results/*.xcresult
      - $CM_BUILD_DIR/RyhzeApp/Launcher/build/ios-test-results/*.log
    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - Ryhze Internal
