workflows:
  apple-verification:
    name: Ryhze Apple build verification
    working_directory: RyhzeApp/Launcher
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve packages
        script: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Validate shared application
        script: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Build iPhone and iPad simulator application
        script: flutter build ios --simulator --debug
      - name: Exercise iOS screens and remembered sign-in
        script: bash ../Build/verify-ios.sh
      - name: Verify device release compilation
        script: flutter build ios --release --no-codesign
      - name: Build macOS application
        script: flutter build macos --release
    artifacts:
      - RyhzeApp/Launcher/build/ios/iphonesimulator/*.app
      - RyhzeApp/Launcher/build/macos/Build/Products/Release/*.app
      - RyhzeApp/Launcher/.private/qa/*.png
      - RyhzeApp/Launcher/build/ios-test-results/*.xcresult
      - RyhzeApp/Launcher/build/ios-test-results/*.log

  ios-testflight:
    name: Ryhze TestFlight release
    working_directory: RyhzeApp/Launcher
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ryhze TestFlight
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ryhze.ryhze
    scripts:
      - name: Resolve and validate
        script: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter analyze
          flutter test
      - name: Use configured signing profiles
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Verify iOS behavior before publishing
        script: bash ../Build/verify-ios.sh
      - name: Build signed release
        script: |
          set -euo pipefail
          : "${PROJECT_BUILD_NUMBER:?Codemagic project build number is required}"
          flutter build ipa --release --build-number="$((PROJECT_BUILD_NUMBER + 34))" --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - RyhzeApp/Launcher/build/ios/ipa/*.ipa
      - RyhzeApp/Launcher/build/ios/archive/*.xcarchive
      - RyhzeApp/Launcher/build/ios-test-results/*.xcresult
      - RyhzeApp/Launcher/build/ios-test-results/*.log
    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - Ryhze Internal
