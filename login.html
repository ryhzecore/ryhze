<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in — Ryhze</title><link rel="stylesheet" href="/assets/theme.css"></head><body class="auth-page"><main class="panel auth-card"><a class="brand" href="/"><img src="/assets/ryhze-wordmark.png" alt="Ryhze"></a><h1>Welcome back</h1><p>Sign in to your Ryhze account.</p><form id="loginForm"><label>User ID<input name="username" autocomplete="username" maxlength="80" required autocapitalize="none" spellcheck="false"></label><label>Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><label class="check-label"><input name="remember" type="checkbox">Remember me for 30 days</label><button class="primary" type="submit">Sign in</button><p class="status error" role="alert" aria-live="polite"></p></form><small>Ryhze uses a secure, essential cookie to keep you signed in. <a href="/privacy">Privacy &amp; cookies</a></small><small>Need an account or a password reset? Ask your Ryhze administrator for a new invitation.</small></main><script src="/assets/auth-ui.js" defer></script></body></html>
