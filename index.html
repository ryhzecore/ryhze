  <script>document.write('<script src="library-data.js?v='+Date.now()+'"><\/script>');</script>
  <script>
    const library=window.RyhzeLibrary || {films:[],games:[]};
    let librarySignature=JSON.stringify(library);
    const filmCategories=library.films || [];
    const gameCategories=library.games || [];
    const uniqueTitles=categories=>Array.from(new Map(categories.flatMap(category=>category.items||[]).map(item=>[item.title,item])).values());
    const films=uniqueTitles(filmCategories);
    const games=uniqueTitles(gameCategories);
    const state={mode:'films'}; const content=document.querySelector('#content'), hero=document.querySelector('#heroCopy'), heroImage=document.querySelector('.hero-image'), exclusiveDots=document.querySelector('#exclusiveDots'), modal=document.querySelector('#modal'), toast=document.querySelector('#toast'), searchResults=document.querySelector('#searchResults'), menuMusic=document.querySelector('#menuMusic'),lobbyFade=document.querySelector('#lobbyFade'); menuMusic.volume=.38;let musicStarted=false;const startMenuMusic=()=>{if(musicStarted)return;menuMusic.play().then(()=>musicStarted=true).catch(()=>{})};addEventListener('pointerdown',startMenuMusic,{once:true});addEventListener('keydown',startMenuMusic,{once:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)menuMusic.pause();else if(musicStarted)menuMusic.play().catch(()=>{})});const fadeToPlayer=url=>{if(lobbyFade.classList.contains('show'))return;lobbyFade.classList.add('show');setTimeout(()=>location.href=url,590)};const revealLobby=()=>{if(sessionStorage.getItem('ryhzeReturnFade')!=='1')return;sessionStorage.removeItem('ryhzeReturnFade');lobbyFade.classList.add('show');requestAnimationFrame(()=>setTimeout(()=>lobbyFade.classList.remove('show'),70))};addEventListener('pageshow',revealLobby);revealLobby(); let featuredIndex=0, currentExclusive=null, isFavorite=false;
    const card=(item, gamesMode)=>`<button class="card item${gamesMode?' game-card':''}" data-title="${item.title}" data-meta="${(item.categories||[]).join(', ')}" data-synopsis="${encodeURIComponent(item.synopsis||'')}" data-image="${item.image||''}" data-streams="${encodeURIComponent(JSON.stringify(item.streams||[]))}" data-search="${[item.title,...(item.searchTags||[]),...(item.categories||[])].join(' ').toLowerCase()}"${item.image?` style="background-image:url('${item.image}')"`:''}><span class="card-info"><span class="card-title" title="${item.title}">${item.title}</span><span class="card-detail"><span></span><span class="tag" title="${(item.categories||[]).join(', ')}">${gamesMode?'Game':'Film'}</span></span></span></button>`;
    const getExclusives=()=>{const categories=state.mode==='games'?gameCategories:filmCategories;return (categories.find(category=>category.title.trim().toLowerCase()==='exclusives')||{items:[]}).items||[]};
    function setExclusiveImage(item,imageIndex=0){const images=item?.exclusiveImages||[];document.documentElement.style.setProperty('--exclusive-image',images.length?`url("${images[imageIndex%images.length]}")`:'none');}
    function render(){const gamesMode=state.mode==='games', categories=gamesMode?gameCategories:filmCategories, exclusives=getExclusives(), featuredSlide=exclusives.length?exclusives[featuredIndex%exclusives.length]:null;currentExclusive=featuredSlide; document.body.classList.toggle('games',gamesMode); document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode)); setExclusiveImage(featuredSlide); hero.innerHTML=featuredSlide?`<div class="eyebrow">Ryhze Exclusives</div><h1>${featuredSlide.title}</h1><p class="description">${featuredSlide.synopsis||`A Ryhze ${gamesMode?'game':'film'} exclusive, available only here.`}</p><div class="actions"><button class="glass action primary play">${gamesMode?'Buy now':'Watch now'}</button><div class="more-wrap"><button class="glass action secondary info">More info</button><div class="exclusive-menu"><button data-exclusive-action="list">Add to list <span>＋</span></button><button data-exclusive-action="rate">Rate show <span>★</span></button><button data-exclusive-action="favorite">Favorite <span class="favorite-star">${isFavorite?'★':'☆'}</span></button></div></div></div>`:''; exclusiveDots.innerHTML=exclusives.map((item,index)=>`<button class="exclusive-dot${featuredSlide&&index===featuredIndex%exclusives.length?' active':''}" data-exclusive="${index}" aria-label="${item.title}"></button>`).join('');content.innerHTML=categories.filter(category=>category.title.trim().toLowerCase()!=='exclusives').map(category=>`<section class="section"><div class="section-head"><h2>${category.title}</h2></div><div class="row${gamesMode?' games-row':''}">${(category.items||[]).map(item=>card(item,gamesMode)).join('')}</div></section>`).join(''); }
    function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
    function openFilm(item){if(document.querySelector('.thumbnail-transition'))return;const source=item.getBoundingClientRect(),transition=document.createElement('div');transition.className='thumbnail-transition';transition.style.cssText=`left:${source.left}px;top:${source.top}px;width:${source.width}px;height:${source.height}px;border-radius:${getComputedStyle(item).borderRadius};background-image:url("${item.dataset.image}");transition:none`;document.body.append(transition);void transition.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>{transition.style.transition='';transition.style.left='0';transition.style.top='0';transition.style.width='100vw';transition.style.height='100vh';transition.style.borderRadius='0'}));setTimeout(()=>transition.classList.add('to-black'),1300);setTimeout(()=>{location.href=`player.html?intro=1&title=${encodeURIComponent(item.dataset.title)}&synopsis=${encodeURIComponent(decodeURIComponent(item.dataset.synopsis||''))}&image=${encodeURIComponent(item.dataset.image||'')}&streams=${encodeURIComponent(item.dataset.streams||'')}`},1800)}addEventListener('pagehide',()=>document.querySelectorAll('.thumbnail-transition').forEach(transition=>transition.remove()));
    document.addEventListener('click',e=>{const tab=e.target.closest('.tab'); if(tab){state.mode=tab.dataset.mode;featuredIndex=0;render();resetSlideshowTimer();return} const dot=e.target.closest('.exclusive-dot'); if(dot&&!dot.disabled){featuredIndex=Number(dot.dataset.exclusive);render();resetSlideshowTimer();hero.classList.add('fade-in');setTimeout(()=>hero.classList.remove('fade-in'),850);return} const play=e.target.closest('.play');if(play){if(state.mode==='games')notify('Exclusive game added to your cart');else if(currentExclusive)fadeToPlayer(`player.html?v=${Date.now()}&title=${encodeURIComponent(currentExclusive.title)}&synopsis=${encodeURIComponent(currentExclusive.synopsis||'')}&image=${encodeURIComponent(currentExclusive.image||'')}&streams=${encodeURIComponent(JSON.stringify(currentExclusive.streams||[]))}`);return} const result=e.target.closest('.search-result'); if(result){document.querySelector('#modalTitle').textContent=result.dataset.title;document.querySelector('#modalText').textContent=decodeURIComponent(result.dataset.synopsis||'')||`A Ryhze ${result.dataset.meta} pick, ready for your next great escape.`;modal.classList.add('open');searchResults.classList.remove('open');return} const item=e.target.closest('.item'); if(item){if(state.mode==='films'){openFilm(item);return}document.querySelector('#modalTitle').textContent=item.dataset.title;document.querySelector('#modalText').textContent=decodeURIComponent(item.dataset.synopsis||'')||`A Ryhze ${item.dataset.meta} pick, ready for your next great escape.`;modal.classList.add('open')} const info=e.target.closest('.info'),menuAction=e.target.closest('[data-exclusive-action]');if(info){info.parentElement.querySelector('.exclusive-menu').classList.toggle('open');return}if(menuAction){const action=menuAction.dataset.exclusiveAction;if(action==='favorite'){isFavorite=!isFavorite;menuAction.querySelector('.favorite-star').textContent=isFavorite?'★':'☆';notify(isFavorite?'Added to favorites':'Removed from favorites')}else notify(action==='list'?'Added to your list':'Rating is ready for your score');menuAction.closest('.exclusive-menu').classList.remove('open');return}if(e.target.id==='close'||e.target===modal)modal.classList.remove('open');if(e.target.id==='profile')notify('Profile menu is ready for your account settings.');if(e.target.id==='modalAction'){modal.classList.remove('open');notify('Added to your Ryhze queue.');} if(!e.target.closest('.search-wrap'))searchResults.classList.remove('open');if(!e.target.closest('.more-wrap'))document.querySelectorAll('.exclusive-menu.open').forEach(menu=>menu.classList.remove('open'));});
    document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(), active=state.mode==='games'?games:films, matches=active.filter(item=>[item.title,...(item.searchTags||[]),...(item.categories||[])].join(' ').toLowerCase().includes(q));if(!q){searchResults.classList.remove('open');searchResults.innerHTML='';return}searchResults.innerHTML=matches.length?matches.map(item=>`<button class="search-result" data-title="${item.title}" data-meta="${(item.categories||[]).join(', ')}" data-synopsis="${encodeURIComponent(item.synopsis||'')}">${item.title}</button>`).join(''):'<div class="search-empty">No matching titles</div>';searchResults.classList.add('open');});
    document.querySelector('#search').addEventListener('focus',e=>{if(e.target.value.trim())e.target.dispatchEvent(new Event('input'));});document.addEventListener('click',e=>{const gameCard=e.target.closest('.item');if(gameCard&&state.mode==='games')document.querySelector('#modalAction').textContent='Pre Order';else if(e.target.closest('.item'))document.querySelector('#modalAction').textContent='Add to queue';});document.querySelector('#modalAction').addEventListener('click',e=>{if(e.currentTarget.textContent!=='Pre Order')return;e.stopImmediatePropagation();modal.classList.remove('open');notify('Pre-order added to your Ryhze list.');},{capture:true});
    const heroSection=document.querySelector('.hero');
    let ambientFrame;
    addEventListener('scroll',()=>{if(ambientFrame)return;ambientFrame=requestAnimationFrame(()=>{document.body.style.setProperty('--ambient-shift',`${Math.min(scrollY*.08,120)}px`);ambientFrame=undefined;});},{passive:true});
    let slideshowTimer,artworkTimer,slideshowPaused=false,slideDue=0,artworkDue=0,remainingSlide=10000,remainingArtwork=5000;const swapArtwork=()=>{const images=currentExclusive?.exclusiveImages||[];if(images.length<2)return;heroSection.classList.add('changing');setTimeout(()=>{setExclusiveImage(currentExclusive,1);heroSection.classList.remove('changing');},700)};const advanceSlide=()=>{const exclusives=getExclusives();if(!exclusives.length)return;heroSection.classList.add('changing');hero.classList.add('slide-away');setTimeout(()=>{featuredIndex=(featuredIndex+1)%exclusives.length;render();hero.classList.remove('slide-away');heroSection.classList.remove('changing');hero.classList.add('fade-in');setTimeout(()=>hero.classList.remove('fade-in'),850);resetSlideshowTimer()},700)};const scheduleTimers=(slideDelay=10000,artDelay=5000)=>{clearTimeout(slideshowTimer);clearTimeout(artworkTimer);slideDue=performance.now()+slideDelay;artworkDue=performance.now()+artDelay;slideshowTimer=setTimeout(advanceSlide,slideDelay);artworkTimer=setTimeout(swapArtwork,artDelay)};function resetSlideshowTimer(){slideshowPaused=false;remainingSlide=10000;remainingArtwork=5000;scheduleTimers()}function pauseSlideshow(){if(slideshowPaused)return;slideshowPaused=true;remainingSlide=Math.max(0,slideDue-performance.now());remainingArtwork=Math.max(0,artworkDue-performance.now());clearTimeout(slideshowTimer);clearTimeout(artworkTimer)}function resumeSlideshow(){if(!slideshowPaused)return;slideshowPaused=false;scheduleTimers(remainingSlide,remainingArtwork)}document.addEventListener('pointerover',e=>{const button=e.target.closest('.hero .play,.hero .info');if(button&&!button.contains(e.relatedTarget))pauseSlideshow()});document.addEventListener('pointerout',e=>{const button=e.target.closest('.hero .play,.hero .info');if(button&&!button.contains(e.relatedTarget))resumeSlideshow()});
    setInterval(()=>{const updatedScript=document.createElement('script');updatedScript.src=`library-data.js?v=${Date.now()}`;updatedScript.onload=()=>{if(JSON.stringify(window.RyhzeLibrary)!==librarySignature)location.reload();updatedScript.remove();};updatedScript.onerror=()=>updatedScript.remove();document.head.append(updatedScript);},3000);
    resetSlideshowTimer();
    render();
  </script>
