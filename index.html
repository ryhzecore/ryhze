<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Ryhze — watch, play, discover</title>
  <style>
    :root{--violet:#5500FF;--ink:#fbfaff;--muted:#c6c0d8}*{box-sizing:border-box}html{background:#05030d}body{min-height:100vh;margin:0;overflow:hidden;background:#05030d;color:var(--ink);font:500 16px/1.45 Inter,system-ui,sans-serif}.aurora{position:fixed;inset:-20%;z-index:0;background:radial-gradient(circle at 18% 25%,#5b21e9aa,transparent 28%),radial-gradient(circle at 80% 5%,#210860cc,transparent 32%),radial-gradient(circle at 75% 82%,#5500ff80,transparent 34%),#05030d;filter:blur(18px);animation:drift 16s ease-in-out infinite alternate}@keyframes drift{to{transform:scale(1.14) translate3d(-2%,2%,0)}}.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:clamp(24px,4vw,62px)}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;flex-direction:column;gap:5px}.brand img{width:clamp(120px,15vw,180px);height:42px;object-fit:contain;object-position:left;mix-blend-mode:screen}.beta{width:max-content;padding:3px 7px;border:1px solid #b8a1ff7a;border-radius:999px;background:#5500ff4d;color:#eeeaff;font-size:9px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.join{padding:10px 16px;border:1px solid #cfc1ff82;border-radius:999px;background:#160a3b80;color:#fff;font:800 13px inherit;backdrop-filter:blur(16px);cursor:pointer;transition:.22s}.join:hover{transform:scale(1.05);background:#261064aa}.hero{flex:1;display:grid;place-items:center;text-align:center}.hero-inner{max-width:840px;margin-top:-4vh}.eyebrow{margin:0 0 16px;color:#d8ceff;font-size:11px;font-weight:850;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font-size:clamp(58px,10vw,142px);line-height:.87;letter-spacing:-.09em;text-wrap:balance}.copy{max-width:600px;margin:28px auto;color:var(--muted);font-size:clamp(16px,2vw,20px)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:36px}.action{min-width:155px;padding:14px 22px;border:1px solid transparent;border-radius:999px;font:850 15px inherit;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}.action:hover{transform:scale(1.06)}.primary{background:#fff;color:var(--violet);box-shadow:0 15px 34px #fff3}.secondary{border-color:#c7b7ff78;background:#190947a8;color:#fff;backdrop-filter:blur(20px)}.note{margin-top:18px;color:#aaa2bd;font-size:12px}.footer{display:flex;justify-content:space-between;gap:15px;color:#aba4ba;font-size:12px}.footer a{color:#e6deff;text-decoration:none}@media(max-width:600px){.shell{padding:24px}.hero-inner{margin-top:0}.footer{flex-direction:column}.join{display:none}}
  </style>
  <style>.action{display:inline-block;text-decoration:none}</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="shell">
    <header class="top"><div class="brand"><img src="assets/ryhze-wordmark.png" alt="Ryhze"><span class="beta">Beta</span></div><button class="join" type="button">Sign in</button></header>
    <main class="hero"><div class="hero-inner"><p class="eyebrow">Your next universe awaits</p><h1>Stories to watch.<br>Worlds to play.</h1><p class="copy">Ryhze brings together your films and games in one cinematic home.</p><div class="actions"><a class="action primary" href="lobby.html">Enter Ryhze</a><a class="action secondary" href="lobby.html?mode=games">Explore games</a></div><p class="note">A Ryhze experience</p></div></main>
    <footer class="footer"><span>© 2026 Ryhze. All rights reserved.</span><span><a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a></span></footer>
  </div>
</body>
</html>
