name: Publish redirect to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: next
      - run: npm test
        working-directory: next
      - run: npm run build
        working-directory: next
      - uses: actions/configure-pages@v5
      - run: |
          mkdir redirect
          printf '%s' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://ryhze-web.live-insights.workers.dev/games"><link rel="canonical" href="https://ryhze.com/"><title>Ryhze</title><a href="https://ryhze-web.live-insights.workers.dev/games">Continue to Ryhze</a>' > redirect/index.html
          cp redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - name: Deploy redirect
        id: deployment
        uses: actions/deploy-pages@v4
